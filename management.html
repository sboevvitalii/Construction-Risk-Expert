<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, follow">  <!-- remove this line when the page gets its real content -->
<title>Управление строительством</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#eef0ea; --ink:#16233b; --redline:#b23a24; --white:#ffffff;
    --font-display:'Zilla Slab', Georgia, 'Times New Roman', serif;
    --font-body:'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', SFMono-Regular, Consolas, monospace;
  }
  /* brand colours are fixed regardless of the viewer's OS theme */
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#eef0ea; --ink:#16233b; --redline:#b23a24; --white:#ffffff; } }
  :root[data-theme="dark"]{ --paper:#eef0ea; --ink:#16233b; --redline:#b23a24; --white:#ffffff; }
  *,*::before,*::after{ box-sizing:border-box; }
  html{ min-height:100%; }
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column;
    background: var(--ink); color: var(--paper);
    font-family: var(--font-body); font-size:16px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; }
  :focus-visible{ outline:2px solid var(--redline); outline-offset:3px; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
  .wrap{ width:100%; max-width:1120px; margin:0 auto; padding:0 28px; }

  .nav{ position:sticky; top:0; z-index:50; padding-top:env(safe-area-inset-top,0px); background:rgba(22,35,59,0.92); backdrop-filter:blur(6px); border-bottom:1px solid rgba(238,240,234,0.1); }
  .nav .wrap{ display:flex; align-items:center; justify-content:space-between; height:64px; gap:20px; }
  .social-row{ display:flex; gap:14px; align-items:center; }
  .social-btn{ display:inline-flex; width:42px; height:42px; border-radius:50%; text-decoration:none; transition:transform 150ms ease, filter 150ms ease; }
  .social-btn:hover{ transform:translateY(-2px) scale(1.08); filter:drop-shadow(0 4px 10px rgba(0,0,0,0.5)); }
  .social-btn:focus-visible{ outline:2px solid var(--redline); outline-offset:3px; }
  .ico{ display:block; width:100%; height:100%; }
  @media (max-width:480px){ .social-row{ gap:8px; } .social-btn{ width:34px; height:34px; } .nav .wrap{ gap:12px; } }
  @media (prefers-reduced-motion: reduce){ .social-btn{ transition:none; } .social-btn:hover{ transform:none; } }
  .lang-switch{ display:flex; border:1px solid rgba(238,240,234,0.35); border-radius:2px; overflow:hidden; flex-shrink:0; }
  .lang-btn{ font-family:var(--font-mono); font-size:0.76rem; letter-spacing:0.02em; background:transparent; border:none; color:rgba(238,240,234,0.55); padding:7px 10px; cursor:pointer; transition:background 150ms ease, color 150ms ease; }
  .lang-btn + .lang-btn{ border-left:1px solid rgba(238,240,234,0.25); }
  .lang-btn:hover{ color:var(--paper); }
  .lang-btn.is-active{ background:rgba(238,240,234,0.14); color:var(--paper); }

  main{ flex:1; display:flex; align-items:center; padding:72px 0; }
  .stub-tag{ font-family:var(--font-mono); font-size:0.82rem; color:#d98a76; margin-bottom:14px; }
  h1{ margin:0; font-family:var(--font-display); font-weight:600; letter-spacing:-0.01em; line-height:1.1; font-size:clamp(2rem, 4.6vw, 3.4rem); color:var(--white); max-width:18ch; }
  .stub-rule{ width:56px; height:3px; background:var(--redline); margin:26px 0; }
  .stub-text{ max-width:46ch; color:rgba(238,240,234,0.75); font-size:1.05rem; }
  .btn-stamp{ display:inline-block; margin-top:34px; font-family:var(--font-mono); font-size:0.92rem; color:var(--ink); background:var(--paper); text-decoration:none; padding:14px 26px; border:1.5px solid var(--paper); transition:background 150ms ease, color 150ms ease, border-color 150ms ease; }
  .btn-stamp:hover{ background:var(--redline); border-color:var(--redline); color:var(--white); }
</style>
</head>
<body>

<div class="nav">
  <div class="wrap">
    <div class="social-row">
      <!-- LinkedIn is still a placeholder (href="#" + data-placeholder) -->
      <a class="social-btn" href="#" data-placeholder aria-label="LinkedIn" title="LinkedIn"><img class="ico" src="assets/icons/linkedin.svg" alt="" width="42" height="42"></a>
      <a class="social-btn" href="https://www.instagram.com/partner_construction_manager/" target="_blank" rel="noopener" aria-label="Instagram" title="Instagram"><img class="ico" src="assets/icons/instagram.svg" alt="" width="42" height="42"></a>
      <a class="social-btn" href="https://wa.me/77012923910" target="_blank" rel="noopener" aria-label="WhatsApp" title="WhatsApp"><img class="ico" src="assets/icons/whatsapp.svg" alt="" width="42" height="42"></a>
      <a class="social-btn" href="https://t.me/sergey_sboyev" target="_blank" rel="noopener" aria-label="Telegram" title="Telegram"><img class="ico" src="assets/icons/telegram.svg" alt="" width="42" height="42"></a>
      <a class="social-btn" href="mailto:constructionmanager@mail.ru" aria-label="Email" title="Email"><img class="ico" src="assets/icons/email.svg" alt="" width="42" height="42"></a>
    </div>
    <div class="lang-switch" role="group" aria-label="Язык / Language">
      <button type="button" class="lang-btn" data-lang="ru">RU</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
    </div>
  </div>
</div>

<main>
  <div class="wrap">
    <div class="stub-tag" data-i18n="tag">страница в разработке</div>
    <h1 data-i18n="title">Управление строительством</h1>
    <div class="stub-rule"></div>
    <p class="stub-text" data-i18n="text">Материал для этой страницы появится позже.</p>
    <a class="btn-stamp" href="index.html" data-i18n="back">На главную</a>
  </div>
</main>

<script>
(function(){
  var T = {
    ru: { tag:"страница в разработке", title:"Управление строительством", text:"Материал для этой страницы появится позже.", back:"На главную" },
    en: { tag:"page in progress", title:"Construction management", text:"Content for this page will be added later.", back:"Back to home" }
  };
  var KEY = 'riskSiteLang';
  function saved(){ try{ return localStorage.getItem(KEY); }catch(e){ return null; } }
  function save(l){ try{ localStorage.setItem(KEY, l); }catch(e){} }
  function pick(){
    var s = saved();
    if(s === 'ru' || s === 'en') return s;
    return (navigator.language || '').toLowerCase().indexOf('ru') === 0 ? 'ru' : 'en';
  }
  function apply(lang){
    var t = T[lang];
    document.documentElement.setAttribute('lang', lang);
    document.title = t.title;
    var nodes = document.querySelectorAll('[data-i18n]');
    for(var i = 0; i < nodes.length; i++) nodes[i].textContent = t[nodes[i].getAttribute('data-i18n')];
    var btns = document.querySelectorAll('.lang-btn');
    for(var b = 0; b < btns.length; b++){
      var on = btns[b].getAttribute('data-lang') === lang;
      btns[b].classList.toggle('is-active', on);
      btns[b].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
  }
  apply(pick());
  var btns = document.querySelectorAll('.lang-btn');
  for(var i = 0; i < btns.length; i++){
    btns[i].addEventListener('click', function(){
      var l = this.getAttribute('data-lang');
      save(l);
      apply(l);
    });
  }
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[data-placeholder]');
    if(a) e.preventDefault();
  });
})();
</script>

</body>
</html>
